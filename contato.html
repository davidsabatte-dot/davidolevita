<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - David O Levita</title>
  <style>
    :root { --primary-navy: #0A192F; --secondary-gold: #D4AF37; --dark-bg: #030712; --light-text: #F8FAFC; --gray-text: #94A3B8; --card-bg: #1E293B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--dark-bg); color: var(--light-text); line-height: 1.6; }
    header { background-color: var(--primary-navy); border-bottom: 2px solid var(--secondary-gold); position: sticky; top: 0; z-index: 1000; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--secondary-gold); text-decoration: none; }
    .nav-menu { display: flex; list-style: none; gap: 1.5rem; }
    .nav-menu a { color: var(--light-text); text-decoration: none; font-weight: 500; }
    .nav-menu a:hover { color: var(--secondary-gold); }
    .content-box { max-width: 700px; margin: 2rem auto; padding: 2rem; background-color: var(--card-bg); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
    h1 { color: var(--secondary-gold); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--light-text); }
    input, textarea { width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); background-color: var(--dark-bg); color: var(--light-text); }
    button { background-color: var(--secondary-gold); color: var(--primary-navy); font-weight: bold; border: none; padding: 0.8rem 1.5rem; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
    button:hover { opacity: 0.9; }
    footer { background-color: var(--primary-navy); border-top: 1px solid rgba(212, 175, 55, 0.3); padding: 2rem 0; margin-top: 4rem; text-align: center; }
    .footer-links { display: flex; justify-content: center; gap: 1.5rem; list-style: none; margin-bottom: 1rem; }
    .footer-links a { color: var(--gray-text); text-decoration: none; font-size: 0.9rem; }
    .footer-links a:hover { color: var(--secondary-gold); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">David O Levita</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="content-box">
    <h1>Fale Conosco</h1>
    <form name="contato" method="POST" data-netlify="true">
      <div class="form-group">
        <label for="nome">Seu Nome:</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
      </div>
      <div class="form-group">
        <label for="email">Seu E-mail:</label>
        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
      </div>
      <div class="form-group">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
      </div>
      <button type="submit">Enviar Mensagem</button>
    </form>
  </div>

  <footer>
    <ul class="footer-links">
      <li><a href="politica-de-privacidade.html">Política de Privacidade</a></li>
      <li><a href="termos-de-uso.html">Termos de Uso</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
    <p>&copy; 2026 David O Levita - Todos os direitos reservados.</p>
  </footer>
</body>
</html>
